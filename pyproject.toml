[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claimbench"
version = "1.0.0"
description = "Open-Source Claim Verification Workbench: collect articles, statements, archived pages and image metadata; build an evidence timeline; separate verified facts from allegations; flag contradictions."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "beautifulsoup4>=4.12", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
claimbench = "claimbench.__main__:main"

[tool.setuptools.packages.find]
include = ["claimbench*"]

[tool.setuptools.package-data]
claimbench = ["static/*", "static/vendor/*", "static/vendor/images/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore:.*httpx.*"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "B905", "E501"]
